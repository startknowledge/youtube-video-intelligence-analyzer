<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Accent Border Top -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accentGrad)" />

  <!-- Big Circle Background (Right side visual) -->
  <circle cx="900" cy="315" r="220" fill="none" stroke="#ef4444" stroke-width="6" opacity="0.2" />
  <circle cx="900" cy="315" r="180" fill="none" stroke="#8b5cf6" stroke-width="6" opacity="0.3" />

  <!-- Play Button Icon (YouTube) inside circle -->
  <polygon points="840,250 840,380 990,315" fill="#ef4444" opacity="0.9" />
  <!-- AI Sparkle -->
  <path d="M960 200 L970 230 L1000 240 L970 250 L960 280 L950 250 L920 240 L950 230 Z" fill="#8b5cf6" opacity="0.8" />

  <!-- Main Title -->
  <text x="60" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff">YouTube Video</text>
  <text x="60" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff">Intelligence Analyzer</text>

  <!-- Subtitle -->
  <rect x="60" y="310" width="500" height="4" fill="url(#accentGrad)" rx="2" />
  <text x="60" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">AI-powered metadata &amp; SEO analysis</text>
  <text x="60" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="300" fill="#94a3b8">YouTube API + Gemini / Groq / OpenRouter</text>

  <!-- Feature Tags (Bottom Left) -->
  <rect x="60" y="480" width="160" height="40" rx="20" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
  <text x="140" y="506" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#f87171">📊 Stats</text>

  <rect x="240" y="480" width="180" height="40" rx="20" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
  <text x="330" y="506" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#a78bfa">🧠 AI Insights</text>

  <rect x="440" y="480" width="200" height="40" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="540" y="506" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7dd3fc">⚡ Cloudflare</text>

  <!-- Built with label -->
  <text x="60" y="580" font-family="Segoe UI" font-size="14" fill="#64748b">GitHub → Cloudflare Pages → Workers → YouTube API</text>

  <!-- Watermark / Brand -->
  <text x="1140" y="620" text-anchor="end" font-family="Segoe UI" font-size="12" fill="#475569" opacity="0.6">v1.0</text>

  <!-- Text -->
  <text x="256" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" letter-spacing="4">YouTube V.I.A.</text>
</svg>