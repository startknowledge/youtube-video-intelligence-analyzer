name = "youtube-video-intelligence-api"

main = "src/index.js"

compatibility_date = "2026-08-30"

[vars]

YOUTUBEVIDEOANALYZER_AI_ENABLED = "true"

YOUTUBEVIDEOANALYZER_YOUTUBE_RELATED_SEARCH = "true"

YOUTUBEVIDEOANALYZER_AI_PRIMARY = "gemini"

YOUTUBEVIDEOANALYZER_AI_GEMINI_MODEL = "gemini-2.5-flash"

YOUTUBEVIDEOANALYZER_AI_GROQ_MODEL = "llama-3.3-70b-versatile"

YOUTUBEVIDEOANALYZER_AI_OPENROUTER_MODEL = "openai/gpt-oss-20b"

YOUTUBEVIDEOANALYZER_AI_OPENAI_MODEL = "gpt-4o-mini"

[observability]

enabled = true